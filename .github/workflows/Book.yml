name: Book
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref }}
env:
  CARGO_TERM_COLOR: always
on:
  pull_request:
    branches: main
  push:
    branches: main
permissions: {}
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Ansifilter
        run: sudo apt-get install -y ansifilter
      - name: mdBook
        run: cargo install mdbook --version 0.4.52
      - name: Dependencies
        run: cargo install mdbook-cmdrun --version 0.7.3 && cargo install mdbook-katex --version 0.9.4
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: CLI
        run: cargo install --path .
      - name: Rust
        run: cargo build --release
      - name: Python
        run: pip install .
      - name: Test
        run: mdbook test --library-path target/release/deps/
      - name: Build
        run: mdbook build
      - name: Move
        run: mkdir -p _site/ && cp -r book/build/* _site/
      - name: Upload
        uses: actions/upload-pages-artifact@v5
  Deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: Build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v5
