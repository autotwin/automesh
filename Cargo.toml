[package]
authors = ["Chad B. Hovey <chovey@sandia.gov>", "Michael R. Buche <mrbuche@sandia.gov>"]
categories = ["mathematics", "science"]
description = "Automatic mesh generation."
documentation = "https://docs.rs/automesh"
edition = "2024"
exclude = [".github/", "book*", "pubs/", "sandbox/", "tests/"]
homepage = "https://autotwin.github.io/automesh"
keywords = ["mesh"]
license = "GPL-3.0"
name = "automesh"
repository = "https://github.com/autotwin/automesh"
version = "0.4.7"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
# TEMPORARY: conspire `main` (unreleased 0.7.8) for tet meshing, via the
# `dual-background-curvature` branch (conspire PR #182) until it merges;
# switch back to `branch = "main"` once it does.
conspire = { git = "https://github.com/mrbuche/conspire.rs", branch = "dual-background-curvature", features = ["geometry"] }

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/katex.html"]

[profile.release]
codegen-units = 1
lto = true
