[package]
authors = ["Chad B. Hovey <chovey@sandia.gov>", "Michael R. Buche <mrbuche@sandia.gov>"]
categories = ["mathematics", "science"]
description = "Automatic mesh generation."
documentation = "https://docs.rs/automesh"
edition = "2024"
exclude = [".github/", "book*", "pubs/", "sandbox/", "tests/"]
homepage = "https://autotwin.github.io/automesh"
keywords = ["mesh"]
license = "GPL-3.0"
name = "automesh"
repository = "https://github.com/autotwin/automesh"
version = "0.4.7"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
# TEMPORARY: pinned to conspire.rs main for .off dev (needs #200/#201, and
# ca28ef03 which re-exports Dualization publicly again after #201). Requires
# nightly Rust (main uses the unstable float_algebraic feature). Switch back
# to a crates.io version once mrbuche publishes a release containing these.
conspire = { git = "https://github.com/mrbuche/conspire.rs", rev = "91c462b6", features = ["geometry"] }

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/katex.html"]

[profile.release]
codegen-units = 1
lto = true
